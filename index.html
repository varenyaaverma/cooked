<!DOCTYPE html>
<html>
<head>
  <title>cooked</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

       .screen {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: black;
      opacity: 0;
      transition: opacity 0.6s ease;       cursor: pointer;
    }

    .active {
      opacity: 1;
      z-index: 1;
    }
  </style>
</head>

<body>

   <audio id="music" src="https://files.catbox.moe/wqkupk.mp3"></audio>

    <img class="screen active" src="https://files.catbox.moe/9ov4y5.gif" onclick="nextSlide()">
  <img class="screen" src="https://files.catbox.moe/4jqj2d.gif" onclick="nextSlide()">
  <img class="screen" src="https://files.catbox.moe/pfj0za.gif" onclick="nextSlide()">
  <img class="screen" src="https://files.catbox.moe/d83eje.gif" onclick="nextSlide()">
  <img class="screen" src="https://files.catbox.moe/09saw2.gif" onclick="nextSlide()">
  <img class="screen" src="https://files.catbox.moe/2ac5b6.gif" onclick="nextSlide()">
  <img class="screen" src="https://files.catbox.moe/okp4f3.gif" onclick="nextSlide()">

  <script>
  let screens = document.querySelectorAll(".screen");
  let current = 0;
  let started = false;

  function nextSlide() {

    if (!started) {
      let audio = document.getElementById("music");
      audio.currentTime = 12;
      audio.play();
      started = true;
    }

    screens[current].classList.remove("active");

    current++;

    if (current < screens.length) {
      screens[current].classList.add("active");
    }
  }
</script>

</body>
</html>
